name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Materialize debug keystore
      run: |
        if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
          base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore
        fi
        if [ ! -f debug.keystore ]; then
          cat << 'KEYSTORE_EOF' | base64 -d > debug.keystore 2>/dev/null || cat << 'KEYSTORE_EOF' | base64 --decode > debug.keystore
        
        KEYSTORE_EOF
        fi
        cp debug.keystore app/debug.keystore 2>/dev/null || true

    - name: Build and Test with Gradle
      run: ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: yadin-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: ignore
