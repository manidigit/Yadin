name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Clean repository from stale caches, locks and builds
      run: |
        rm -rf .gradle
        rm -rf build app/build

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'
        wrapper-validation-enabled: false

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Materialize canonical debug keystore
      run: |
        if [ ! -s debug.keystore ] && [ -f debug.keystore.base64 ]; then
          echo "Decoding canonical debug keystore from debug.keystore.base64..."
          tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
        fi
        if [ ! -s debug.keystore ]; then
          echo "ERROR: Canonical debug.keystore could not be materialized. Refusing to generate random key to prevent broken APK updates."
          exit 1
        fi
        mkdir -p ~/.android app
        cp -f debug.keystore app/debug.keystore
        cp -f debug.keystore ~/.android/debug.keystore
        echo "Verifying keystore fingerprint..."
        keytool -list -v -keystore debug.keystore -storepass android | grep -E "SHA1|SHA256"

    - name: Build and Test with Gradle
      run: ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace || gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: yadin-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: warn

